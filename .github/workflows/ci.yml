name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements/dev.txt -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests scripts/browser_test.py scripts/audit_month.py

      - name: Format check (ruff)
        run: ruff format --check src tests scripts/browser_test.py scripts/audit_month.py

      - name: Type check (mypy)
        run: mypy src

      - name: Test (pytest)
        run: pytest

      - name: Install browser test dependencies
        if: matrix.python-version == '3.14'
        run: |
          pip install -e ".[browser]"
          python -m playwright install --with-deps chromium

      - name: Browser regression tests
        if: matrix.python-version == '3.14'
        run: python scripts/browser_test.py

      - name: Documentation (warnings are failures)
        run: sphinx-build -W --keep-going -q docs/source docs/_build/html

      - name: Security checks
        if: matrix.python-version == '3.14'
        run: |
          pip install pip-audit==2.10.1 bandit==1.9.4
          pip-audit --no-deps --disable-pip -r requirements/runtime.txt
          pip-audit --no-deps --disable-pip -r requirements/dev.txt
          bandit -r src -ll
