name: Release

# A matching version tag runs the quality gate, publishes the container, and
# attaches validated distributions before the GitHub release becomes public.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release tag and changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if os.environ["REF_TYPE"] != "tag" or tag != f"v{version}":
              raise SystemExit(f"Release must use tag v{version}; got {tag!r}")
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("Release version must be a stable MAJOR.MINOR.PATCH")
          changelog = Path("CHANGELOG.md").read_text()
          if not re.search(rf"^## \[{re.escape(version)}\] .+$", changelog, re.MULTILINE):
              raise SystemExit(f"Missing changelog entry for {version}")
          PY

  quality:
    needs: validate
    uses: ./.github/workflows/ci.yml

  container:
    needs: quality
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/docker.yml

  release:
    needs: container
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build==1.6.1 twine==7.0.0

      - name: Build package and check metadata
        run: |
          python -m build
          twine check --strict dist/*

      - name: Prepare release notes
        run: |
          python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          changelog = Path("CHANGELOG.md").read_text()
          section = re.search(
              rf"^## \[{re.escape(version)}\] [^\n]+\n(.*?)(?=^## \[|\Z)",
              changelog, re.MULTILINE | re.DOTALL,
          )
          if section is None or not section[1].strip():
              raise SystemExit(f"Missing release notes for {version}")
          notes = section[1].strip() + "\n\n"
          notes += f"Container: `ghcr.io/marcelpetrick/ritterradar:{version}` "
          notes += "(`linux/amd64` and `linux/arm64`).\n"
          Path("release-notes.md").write_text(notes)
          PY

      - name: Publish release with distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --draft \
              --title "RitterRadar $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
