<html lang="de" data-offline="{{ 'true' if offline else 'false' }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}RitterRadar{% endblock %}</title>

  <!-- Leaflet CSS (served locally — no external CDN dependency) -->
  <link rel="stylesheet" href="/static/vendor/leaflet.css?v={{ version }}" />

  <!-- Application styles -->
  <link rel="stylesheet" href="/static/css/ritterradar.css?v={{ version }}" />

  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}

  <!-- Leaflet JS (served locally — no external CDN dependency) -->
  <script src="/static/vendor/leaflet.js?v={{ version }}"></script>

  {% block scripts %}{% endblock %}
</body>
</html>
